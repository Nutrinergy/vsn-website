# Wordt in elke location opnieuw ingeladen (nginx erft add_header niet door).
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), interest-cohort=()" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://service.pdok.nl; connect-src 'self' https://api.pdok.nl; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-ancestors 'self'; form-action 'self' https://formspree.io https://api.web3forms.com; base-uri 'self'" always;
