# nginx: neem op in het server-blok van sportdietetiek.nl
location = /services/ { return 301 /; }
location = /stijl/ { return 301 /; }
location = /onze-dietisten/ { return 301 /zoek-een-sport-dietist-in-de-buurt/; }
rewrite ^/news-feed/(.*)$ https://leden.sportdietetiek.nl/news-feed/$1 permanent;
rewrite ^/leden/(.*)$ https://leden.sportdietetiek.nl/leden/$1 permanent;
rewrite ^/groepen/(.*)$ https://leden.sportdietetiek.nl/groepen/$1 permanent;
rewrite ^/forums/(.*)$ https://leden.sportdietetiek.nl/forums/$1 permanent;
rewrite ^/topics/(.*)$ https://leden.sportdietetiek.nl/topics/$1 permanent;
rewrite ^/fotos/(.*)$ https://leden.sportdietetiek.nl/fotos/$1 permanent;
rewrite ^/documenten/(.*)$ https://leden.sportdietetiek.nl/documenten/$1 permanent;
rewrite ^/videos/(.*)$ https://leden.sportdietetiek.nl/videos/$1 permanent;
rewrite ^/dashboard/(.*)$ https://leden.sportdietetiek.nl/dashboard/$1 permanent;
rewrite ^/login/.*$ https://leden.sportdietetiek.nl/login/ permanent;
location = /wp-login.php { return 301 https://leden.sportdietetiek.nl/wp-login.php; }
rewrite ^/register/.*$ /lid-worden/ permanent;
rewrite ^/activate/(.*)$ https://leden.sportdietetiek.nl/activate/$1 permanent;
location = /agenda-item-maken/ { return 301 https://leden.sportdietetiek.nl/agenda-item-maken/; }
location = /blogpost-maken/ { return 301 https://leden.sportdietetiek.nl/blogpost-maken/; }
location = /aanmelden-vsn-alv/ { return 301 https://leden.sportdietetiek.nl/aanmelden-vsn-alv/; }
location = /aanmelden-vsn-masterclass/ { return 301 https://leden.sportdietetiek.nl/aanmelden-vsn-masterclass/; }
rewrite ^/aanmelden-vsn-studiedag/(.*)$ https://leden.sportdietetiek.nl/aanmelden-vsn-studiedag/$1 permanent;
location = /agenda/vsn-bestuursvergadering/ { return 301 /agenda/; }
location = /agenda/vsn-bestuursvergadering-2/ { return 301 /agenda/; }
rewrite ^/category/agenda/.*$ /agenda/ permanent;
location = /category/kennisbank/basisvoeding/ { return 301 /kennisbank/basisvoeding/; }
location = /category/kennisbank/sport/ { return 301 /kennisbank/sport/; }
rewrite ^/category/kennisbank/recepten/.*$ /kennisbank/recepten/ permanent;
location = /category/kennisbank/voeding-en-herstel/ { return 301 /voeding-en-sport/voeding-en-herstel/; }
rewrite ^/category/kennisbank/.*$ /kennisbank/ permanent;
rewrite ^/author/.*$ /kennisbank/ permanent;
rewrite ^/feed/.*$ /kennisbank/ permanent;
