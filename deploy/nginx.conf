server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Coolify/Traefik zit ervoor: geen poortnummers of http-URL's in redirects
  absolute_redirect off;
  port_in_redirect off;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 512;
  gzip_types text/plain text/css application/javascript application/json application/ld+json image/svg+xml application/xml text/xml application/manifest+json;

  include /etc/nginx/snippets/security-headers.conf;
  include /etc/nginx/snippets/redirects.conf;

  error_page 404 /404.html;

  # Gehashte bestanden: een jaar cachen
  location /_astro/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }
  location /fonts/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }
  location ~* \.(?:jpg|jpeg|png|webp|svg|ico|webmanifest)$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=604800" always;
    try_files $uri =404;
  }

  # HTML: altijd hervalideren, zodat nieuwe deploys direct zichtbaar zijn
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ =404;
  }
}
